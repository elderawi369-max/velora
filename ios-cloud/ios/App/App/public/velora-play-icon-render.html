<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Velora Play Icon Render</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
      }

      img {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <img src="./velora-favicon.svg" alt="Velora" />
  </body>
</html>
