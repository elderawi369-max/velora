# Build the reviewed iOS snapshot, not the historical frontend on main.
# Builds run manually. The release workflow uploads to App Store Connect
# without submitting to beta review or App Store review.
workflows:
  ios-compile-check:
    name: Velora iOS - Compile check (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Verify packaged release
        script: python3 ios-cloud/verify.py
      - name: Compile Release for iPhone
        script: |
          set -euo pipefail
          mkdir -p build/ios
          xcodebuild build \
            -project ios-cloud/ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ios/compile.log
    artifacts:
      - build/ios/compile.log

  ios-release:
    name: Velora iOS - Upload to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: velora-app-store-connect
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.velorachat.app
    scripts:
      - name: Verify packaged release
        script: python3 ios-cloud/verify.py
      - name: Assign unique cloud build number
        script: |
          set -euo pipefail
          cd ios-cloud/ios/App
          agvtool new-version -all "$((BUILD_NUMBER + 4))"
      - name: Apply uploaded Apple signing identities
        script: |
          set -euo pipefail
          cd ios-cloud/ios/App
          xcode-project use-profiles
      - name: Archive signed iOS app
        script: |
          set -euo pipefail
          mkdir -p build/ios/xcarchive
          xcodebuild archive \
            -project "$CM_BUILD_DIR/ios-cloud/ios/App/App.xcodeproj" \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/Velora.xcarchive" \
            2>&1 | tee build/ios/archive.log
      - name: Correct static SDK resource packaging and verify archive
        script: |
          set -euo pipefail
          python3 ios-cloud/repair_static_sdk.py \
            "$CM_BUILD_DIR/build/ios/xcarchive/Velora.xcarchive/Products/Applications/App.app"
      - name: Export signed IPA
        script: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/Velora.xcarchive" \
            -exportOptionsPlist "$HOME/export_options.plist" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            2>&1 | tee build/ios/export.log
      - name: Verify final IPA compatibility and signatures before upload
        script: |
          set -euo pipefail
          python3 ios-cloud/audit_ipa.py build/ios/ipa/App.ipa \
            --expected-build "$((BUILD_NUMBER + 4))" \
            --verify-signatures --output build/ios/ipa-audit.json
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive/dSYMs/*.dSYM
      - build/ios/*.log
      - build/ios/ipa-audit.json
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  # Manual device-only distribution. No TestFlight or App Store upload.
  ios-direct-install:
    name: Velora iOS - Direct install on registered iPhone
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.velorachat.app
    scripts:
      - name: Verify packaged release
        script: python3 ios-cloud/verify.py
      - name: Enable Google demo ads for direct testing
        script: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Add :VeloraAdTesting bool true' "$CM_BUILD_DIR/ios-cloud/ios/App/App/Info.plist"
      - name: Assign unique cloud build number
        script: |
          set -euo pipefail
          cd ios-cloud/ios/App
          agvtool new-version -all "$((BUILD_NUMBER + 10000))"
      - name: Apply uploaded Apple signing identities
        script: |
          set -euo pipefail
          cd ios-cloud/ios/App
          xcode-project use-profiles
      - name: Archive signed iOS app
        script: |
          set -euo pipefail
          mkdir -p build/ios/xcarchive
          xcodebuild archive \
            -project "$CM_BUILD_DIR/ios-cloud/ios/App/App.xcodeproj" \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/VeloraDirect.xcarchive" \
            2>&1 | tee build/ios/archive.log
      - name: Correct static SDK resource packaging and verify archive
        script: |
          set -euo pipefail
          python3 ios-cloud/repair_static_sdk.py \
            "$CM_BUILD_DIR/build/ios/xcarchive/VeloraDirect.xcarchive/Products/Applications/App.app"
      - name: Export signed IPA
        script: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/VeloraDirect.xcarchive" \
            -exportOptionsPlist "$HOME/export_options.plist" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            2>&1 | tee build/ios/export.log
      - name: Verify direct-install IPA compatibility and signatures
        script: |
          set -euo pipefail
          python3 ios-cloud/audit_ipa.py build/ios/ipa/App.ipa \
            --expected-build "$((BUILD_NUMBER + 10000))" \
            --distribution ad-hoc --expect-test-ads --verify-signatures --output build/ios/ipa-audit.json
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive/dSYMs/*.dSYM
      - build/ios/*.log
      - build/ios/ipa-audit.json
      - /tmp/xcodebuild_logs/*.log
